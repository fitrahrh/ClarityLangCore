# ==============================================================================
#                     ClarityLangCore - Deutsch (de_DE)
# ==============================================================================

# Sprach-Metadaten
language:
  code: "de_DE"
  name: "Deutsch"
  flag: "🇩🇪"
  fallback: "en_US"

# Kern-Plugin-Nachrichten
core:
  prefix: "<gradient:#38ef7d:#11998e><bold>[ClarityLang]</bold></gradient> "
  
  commands:
    help:
      - "<gradient:#38ef7d:#11998e><bold>═════ ClarityLangCore Hilfe ═════</bold></gradient>"
      - "<yellow>/lang</yellow> <gray>- Öffnet das Sprachauswahl-Menü.</gray>"
      - "<yellow>/lang <Code></yellow> <gray>- Sprache direkt ändern (z. B. /lang en_US).</gray>"
      - "<yellow>/lang list</yellow> <gray>- Zeigt alle verfügbaren Sprachen an.</gray>"
      - "<yellow>/lang reset</yellow> <gray>- Auf automatische Client-Erkennung zurücksetzen.</gray>"
      - "<yellow>/lang reload</yellow> <gray>- Konfigurations- und Sprachdateien neu laden (Admin).</gray>"
      - "<gradient:#38ef7d:#11998e><bold>═════════════════════════════════</bold></gradient>"
    success: "<prefix><green>Ihre Sprache wurde erfolgreich auf <yellow><lang_name></yellow> (<lang_code>) geändert!</green>"
    reset: "<prefix><green>Spracheinstellung auf automatische Erkennung zurückgesetzt: <yellow><lang_name></yellow> (<lang_code>)!</green>"
    invalid_language: "<prefix><red>Sprache '<lang>' wurde nicht gefunden! Verwenden Sie <yellow>/lang list</yellow> für eine Übersicht.</red>"
    list_header: "<gradient:#38ef7d:#11998e><bold>═══ Verfügbare Sprachen ═══</bold></gradient>"
    list_entry: "<gray>- <flag> <yellow><lang_name></yellow> (<lang_code>) <white><active></white></gray>"
    list_active_tag: "<green>[Aktiv]</green>"
    no_permission: "<prefix><red>Sie haben keine Berechtigung für diesen Befehl!</red>"
    only_players: "<prefix><red>Dieser Befehl kann nur von Spielern ausgeführt werden!</red>"
    reload_success: "<prefix><green>Alle Konfigurationen und Sprachdateien in <yellow><time>ms</yellow> neu geladen!</green>"
  
  dialog:
    title: "<gradient:#38ef7d:#11998e><bold>SPRACHE AUSWÄHLEN</bold></gradient>"
    body_header: "<white>Willkommen auf dem Server! Wählen Sie Ihre bevorzugte Sprache.</white>"
    body_current: "<gray>Aktuelle Sprache: <yellow><current_flag> <current_name></yellow></gray>"
    body_client_detected: "<gray>Erkannte Minecraft-Clientsprache: <aqua><client_flag> <client_name></aqua></gray>"
    body_instruction: "<gray>Klicken Sie auf eine der Schaltflächen, um Ihre Sprache zu wählen:</gray>"
    radio_label: "<white>Wählen Sie Ihre bevorzugte Sprache:</white>"
    button_tooltip: "<gray>Klicken, um <yellow><lang_name></yellow> auszuwählen</gray>"
    button_active_badge: "<green>✓ </green>"
    button_confirm: "<green>✔ Bestätigen</green>"
    button_confirm_tooltip: "<gray>Klicken, um die ausgewählte Sprache zu speichern</gray>"
    button_cancel: "<red>✖ Abbrechen / Schließen</red>"
    button_cancel_tooltip: "<gray>Klicken, um dieses Menü zu schließen</gray>"
    notice_title: "<green>Sprache Aktualisiert</green>"
    notice_message: "<white>Sprache erfolgreich auf <yellow><lang_name></yellow> geändert!</white>"

economy:
  balance: "<prefix><gray>Ihr Guthaben: <gold><amount></gold></gray>"
  pay_success: "<prefix><green>Erfolgreich <gold><amount></gold> an <yellow><target></yellow> gesendet.</green>"
  pay_received: "<prefix><green>Sie haben <gold><amount></gold> von <yellow><sender></yellow> erhalten!</green>"
  insufficient_funds: "<prefix><red>Nicht genügend Guthaben für diese Transaktion!</red>"
