name: ClarityLangCore
version: '${version}'
main: com.harukiyu.claritylangcore.ClarityLangCore
api-version: '1.21'
description: Centralized multi-language core API plugin for Clarity Network with Native Dialog API
author: Harukiyu
permissions:
